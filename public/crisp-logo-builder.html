<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crisp JUBOH Logo Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      background: #080e18;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    canvas {
      border: 1px solid #334155;
      background-image: 
        linear-gradient(45deg, #0e1726 25%, transparent 25%), 
        linear-gradient(-45deg, #0e1726 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #0e1726 75%), 
        linear-gradient(-45deg, transparent 75%, #0e1726 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      max-width: 90vw;
      height: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #status {
      margin-top: 15px;
      font-family: monospace;
      color: #b59357;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Rendering High-Resolution Crisp JUBOH Logo (+20% Bigger Subtext)</h1>
  <canvas id="canvas" width="1376" height="768"></canvas>
  <div id="status">Loading assets and fonts...</div>

  <script>
    async function init() {
      await document.fonts.ready;
      const status = document.getElementById("status");
      status.textContent = "Fonts loaded. Loading base logo...";

      const baseImg = new Image();
      baseImg.crossOrigin = "anonymous";
      baseImg.src = "/juboh-logo-transparent.png";

      baseImg.onload = () => {
        status.textContent = "Processing canvas...";
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        // 1. Draw base image
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(baseImg, 0, 0);

        // 2. Clear out the old faint/blurry sub-text area below y=415
        ctx.clearRect(275, 415, canvas.width - 275, canvas.height - 415);

        // Center reference under UBOH
        const centerX = 794;
        const lineLeft = 310;
        const lineRight = 1290;
        const availableWidth = lineRight - lineLeft;

        // 3. Draw "COMPANIES" with +20% bigger font (48px)
        const companiesY = 484;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Spacing: distribute letters cleanly
        ctx.letterSpacing = "26px";
        ctx.font = "800 48px 'Cinzel', serif";
        
        ctx.shadowColor = "rgba(0, 0, 0, 0.75)";
        ctx.shadowBlur = 6;
        ctx.shadowOffsetY = 2;
        ctx.fillStyle = "#FFFFFF";
        ctx.fillText("COMPANIES", centerX, companiesY);

        // Reset shadow
        ctx.shadowColor = "transparent";
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;

        // 4. Draw crisp horizontal gold separator line
        const lineY = 554;
        const lineGrad = ctx.createLinearGradient(lineLeft, lineY, lineRight, lineY);
        lineGrad.addColorStop(0, "#8E703D");
        lineGrad.addColorStop(0.2, "#CBA569");
        lineGrad.addColorStop(0.5, "#F3DEAA");
        lineGrad.addColorStop(0.8, "#CBA569");
        lineGrad.addColorStop(1, "#8E703D");

        ctx.fillStyle = lineGrad;
        ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
        ctx.shadowBlur = 4;
        ctx.shadowOffsetY = 1;
        ctx.fillRect(lineLeft, lineY, availableWidth, 4.5);

        // Reset shadow
        ctx.shadowColor = "transparent";
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;

        // 5. Draw "BUILDING AN EXCEPTIONAL FUTURE, TOGETHER" (+20% bigger: 33px)
        const taglineY = 626;
        const part1 = "BUILDING AN EXCEPTIONAL FUTURE, ";
        const part2 = "TOGETHER";

        ctx.letterSpacing = "5.2px";
        
        // Measure text parts
        ctx.font = "700 33px 'Montserrat', sans-serif";
        const width1 = ctx.measureText(part1).width;
        
        ctx.font = "900 33px 'Montserrat', sans-serif";
        const width2 = ctx.measureText(part2).width;

        const totalTaglineWidth = width1 + width2;
        const startX = centerX - (totalTaglineWidth / 2);

        // Draw part 1
        ctx.textAlign = "left";
        ctx.font = "700 33px 'Montserrat', sans-serif";
        ctx.fillStyle = "#FFFFFF";
        ctx.shadowColor = "rgba(0, 0, 0, 0.75)";
        ctx.shadowBlur = 6;
        ctx.shadowOffsetY = 2;
        ctx.fillText(part1, startX, taglineY);

        // Draw part 2 ("TOGETHER" in bold)
        ctx.font = "900 33px 'Montserrat', sans-serif";
        ctx.fillStyle = "#FFFFFF";
        ctx.fillText(part2, startX + width1, taglineY);

        status.textContent = "Render complete! Exporting image...";

        // Export data URL and save to server
        const dataUrl = canvas.toDataURL("image/png");

        fetch("/api/save-logo", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ base64Data: dataUrl })
        })
        .then(res => res.json())
        .then(data => {
          status.textContent = "DONE: Successfully updated public/juboh-logo-transparent.png! (" + data.size + " bytes)";
        })
        .catch(err => {
          status.textContent = "Error saving: " + err;
        });
      };
    }

    window.onload = init;
  </script>
</body>
</html>
