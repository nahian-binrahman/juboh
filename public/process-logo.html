<!DOCTYPE html>
<html>
<head><title>Process Logo</title></head>
<body>
<canvas id="c"></canvas>
<div id="status">Processing...</div>
<script>
const img = new Image();
img.crossOrigin = "anonymous";
img.src = "/juboh-logo-hd.jpg";
img.onload = () => {
  const canvas = document.getElementById("c");
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0);

  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = imgData.data;

  // Find sample background color from corners
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i];
    const g = d[i+1];
    const b = d[i+2];

    // Measure distance from typical dark navy background (r:10, g:18, b:35)
    // Or brightness:
    const luma = 0.299 * r + 0.587 * g + 0.114 * b;

    if (luma < 38) {
      d[i+3] = 0; // completely transparent
    } else if (luma < 70) {
      // smooth alpha feathering
      const alphaFactor = (luma - 38) / (70 - 38);
      d[i+3] = Math.round(255 * alphaFactor);
    }
  }

  ctx.putImageData(imgData, 0, 0);

  const dataUrl = canvas.toDataURL("image/png");

  fetch("/api/save-logo", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ base64Data: dataUrl })
  })
  .then(res => res.json())
  .then(data => {
    document.getElementById("status").textContent = "SUCCESS: " + JSON.stringify(data);
  })
  .catch(err => {
    document.getElementById("status").textContent = "ERROR: " + err;
  });
};
</script>
</body>
</html>
